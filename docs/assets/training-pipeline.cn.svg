.lbl{fill:#A99FE0}
.rlbl{fill:#E2DCFF}
.rsub{fill:#EDE9FF}
.arrow{stroke:#6E6890}
.ah{fill:#6E6890}
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path class="ah" d="M0,1 L10,5 L0,9 z"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="1019" height="399" rx="18"/>
<path class="arrow" stroke-width="2" d="M141.5,270.0 C141.5,229.8 197.0,237.2 197.0,197.0" marker-end="url(#ah)"/>
<path class="arrow" stroke-width="2" d="M305.0,196.0 C305.0,236.2 360.5,228.8 360.5,269.0" marker-end="url(#ah)"/>
<path class="arrow" stroke-width="2" d="M400.5,270.0 C400.5,229.8 456.0,237.2 456.0,197.0" marker-end="url(#ah)"/>
<path class="arrow" stroke-width="2" d="M564.0,196.0 C564.0,236.2 619.5,228.8 619.5,269.0" marker-end="url(#ah)"/>
<path class="arrow" stroke-width="2" d="M659.5,270.0 C659.5,229.8 715.0,237.2 715.0,197.0" marker-end="url(#ah)"/>
<path class="arrow" stroke-width="2" d="M823.0,196.0 C823.0,236.2 878.5,228.8 878.5,269.0" marker-end="url(#ah)"/>
<rect class="card" x="133.0" y="24" width="236" height="172" rx="14" stroke-width="1.2"/>
<rect class="tag" x="153.0" y="44" width="76.0" height="24" rx="12"/>
<text x="165.0" y="60.5" class="tagt" font-size="12" font-weight="700" text-anchor="start">教师模型</text>
<text x="153.0" y="104.0" class="name" font-size="18" font-weight="700" text-anchor="start">Qwen3-VL-30B-A3B</text>
<text x="153.0" y="126.0" class="sub" font-size="14" font-weight="500" text-anchor="start">Thinking</text>
<line class="rule" x1="153.0" y1="143" x2="349.0" y2="143" stroke-width="1"/>
<text x="153.0" y="166.0" class="muted" font-size="13" font-weight="400" text-anchor="start">读取每页图像</text>
<text x="153.0" y="185.0" class="muted" font-size="13" font-weight="400" text-anchor="start">输出 Markdown</text>
<rect class="card" x="392.0" y="24" width="236" height="172" rx="14" stroke-width="1.2"/>
<rect class="tag" x="412.0" y="44" width="76.0" height="24" rx="12"/>
<text x="424.0" y="60.5" class="tagt" font-size="12" font-weight="700" text-anchor="start">评判模型</text>
<text x="412.0" y="104.0" class="name" font-size="18" font-weight="700" text-anchor="start">Qwen3.5-122B-A10B</text>
<text x="412.0" y="126.0" class="sub" font-size="14" font-weight="500" text-anchor="start">NVFP4 版本</text>
<line class="rule" x1="412.0" y1="143" x2="608.0" y2="143" stroke-width="1"/>
<text x="412.0" y="166.0" class="muted" font-size="13" font-weight="400" text-anchor="start">5 个维度，评分 1–5</text>
<text x="412.0" y="185.0" class="muted" font-size="13" font-weight="400" text-anchor="start">低于 3 分的页面被剔除</text>
<rect class="card" x="651.0" y="24" width="236" height="172" rx="14" stroke-width="1.2"/>
<rect class="tag" x="671.0" y="44" width="76.0" height="24" rx="12"/>
<text x="683.0" y="60.5" class="tagt" font-size="12" font-weight="700" text-anchor="start">学生模型</text>
<text x="671.0" y="104.0" class="name" font-size="18" font-weight="700" text-anchor="start">Qwen3-VL-2B</text>
<text x="671.0" y="126.0" class="sub" font-size="14" font-weight="500" text-anchor="start">Instruct</text>
<line class="rule" x1="671.0" y1="143" x2="867.0" y2="143" stroke-width="1"/>
<text x="671.0" y="166.0" class="muted" font-size="13" font-weight="400" text-anchor="start">LoRA r = 8, α = 32, 3 个 epoch</text>
<text x="671.0" y="185.0" class="muted" font-size="13" font-weight="400" text-anchor="start">视觉编码器冻结</text>
<rect class="data" x="20" y="270" width="203" height="106" rx="14" stroke-width="1.2"/>
<text x="38.0" y="297.0" class="lbl" font-size="12" font-weight="700" text-anchor="start">输入</text>
<text x="38.0" y="323.0" class="name" font-size="17" font-weight="700" text-anchor="start">4,501 页 PDF</text>
<text x="38.0" y="345.0" class="muted" font-size="12.5" font-weight="400" text-anchor="start">200 DPI 图像</text>
<rect class="data" x="279" y="270" width="203" height="106" rx="14" stroke-width="1.2"/>
<text x="297.0" y="297.0" class="lbl" font-size="12" font-weight="700" text-anchor="start">伪标签</text>
<text x="297.0" y="323.0" class="name" font-size="17" font-weight="700" text-anchor="start">Markdown 标签</text>
<text x="297.0" y="345.0" class="muted" font-size="12.5" font-weight="400" text-anchor="start">每页一份</text>
<rect class="data" x="538" y="270" width="203" height="106" rx="14" stroke-width="1.2"/>
<text x="556.0" y="297.0" class="lbl" font-size="12" font-weight="700" text-anchor="start">训练数据</text>
<text x="556.0" y="323.0" class="name" font-size="17" font-weight="700" text-anchor="start">2,667 / 294</text>
<text x="556.0" y="345.0" class="muted" font-size="12.5" font-weight="400" text-anchor="start">训练页 / 验证页</text>
<text x="556.0" y="363.0" class="muted" font-size="12.5" font-weight="400" text-anchor="start">每文档上限 25%</text>
<rect class="result" x="797" y="270" width="203" height="106" rx="14" stroke-width="1.2"/>
<text x="815.0" y="297.0" class="rlbl" font-size="12" font-weight="700" text-anchor="start">结果</text>
<text x="815.0" y="323.0" class="rname" font-size="17" font-weight="700" text-anchor="start">WigtnOCR-2B</text>
<text x="815.0" y="345.0" class="rsub" font-size="12.5" font-weight="400" text-anchor="start">checkpoint-600，已合并</text>
</svg>
