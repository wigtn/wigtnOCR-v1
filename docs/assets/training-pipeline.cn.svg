<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="400" viewBox="0 0 1020 400" role="img" aria-label="WigtnOCR 训练流程：教师、评判与学生模型均为 Qwen 模型" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif">
<title>WigtnOCR 训练流程：教师、评判与学生模型均为 Qwen 模型</title>
<style>
.bg{fill:#FAF9FD;stroke:#E6E3F0}
.card{fill:#FFFFFF;stroke:#DCD7EA}
.data{fill:#F3F1F9;stroke:#CFC8E4;stroke-dasharray:5 4}
.result{fill:#3F2E73;stroke:#3F2E73}
.tag{fill:#ECE8FB}
